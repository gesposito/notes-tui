[package]
name = "notes-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal UI and CLI for macOS Apple Notes — Rust port of the Bun/OpenTUI app"
publish = false

[[bin]]
name = "notes"
path = "src/bin/notes.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = [
  "alloc",
  "std",
] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "sync",
] }

[dev-dependencies]
tempfile = "3.27.0"
