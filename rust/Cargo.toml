[package]
name = "notes-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal UI and CLI for macOS Apple Notes — Rust port of the Bun/OpenTUI app"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["process", "io-util"] }
