[package]
name = "notes-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal UI and CLI for macOS Apple Notes — Rust port of the Bun/OpenTUI app"
publish = false
default-run = "notes-tui"

[[bin]]
name = "notes-tui"
path = "src/bin/notes-tui.rs"

[[bin]]
name = "notes"
path = "src/bin/notes.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = [
  "alloc",
  "std",
] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
libdeflater = "1.26.1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "sync",
  "time",
] }
unicode-width = "0.2.2"

[dev-dependencies]
flate2 = "1.1.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
